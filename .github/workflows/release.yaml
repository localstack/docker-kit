# Publishes the kits to docker.io/localstack and signs them. Push a tag that
# matches the kit version, for example v0.2.0 for version "0.2.0".
#
# Needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets in the release
# environment, with push access to the localstack namespace.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish and sign kits
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # keyless signing with the GitHub OIDC token
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the kit version
        run: |
          version="$(sed -n 's/^version: "\(.*\)"$/\1/p' kits/localstack/localstack.yaml)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match kit version $version." >&2
            exit 1
          fi
          echo "KIT_VERSION=$version" >>"$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # build.sh stops if a tag already exists on Docker Hub.
      - name: Build and push the kits
        run: scripts/build.sh
      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx
      - name: Sign the kits
        run: |
          for image in sbx-kit-localstack sbx-localstack-claude sbx-localstack-codex; do
            sbx kit sign "docker.io/localstack/$image:$KIT_VERSION"
          done
